global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'ec2-spring-boot'
    metrics_path: '/actuator/prometheus'
    scheme: http
    static_configs:
      - targets: ['43.201.108.31:8080']

  - job_name: 'ec2-node-exporter'
    static_configs:
      - targets: ['43.201.108.31:9100']

  - job_name: 'ec2-mysql-exporter'
    static_configs:
      - targets: ['43.201.108.31:9104']

  - job_name: 'elasticsearch-exporter'
    static_configs:
      - targets: [ '43.201.108.31:9114' ]