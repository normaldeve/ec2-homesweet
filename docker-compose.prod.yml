version: '3.9'

services:
  spring:
    image: homesweet-backend
    container_name: homesweet-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - homesweet-network
    restart: always

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: always
    ports:
      - "9100:9100"

  elasticsearch_exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    container_name: elasticsearch_exporter
    restart: always
    ports:
      - "9114:9114"
    command:
      - '--es.uri=http://3.36.60.169:9200'
      - '--es.all'
    networks:
      - homesweet-network

  mysqld_exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld_exporter
    restart: always
    command:
      - "--mysqld.username=${DATABASE_USERNAME}:${DATABASE_PASSWORD}"
      - "--mysqld.address=${DATABASE_URL}"
    ports:
      - "9104:9104"
    networks:
      - homesweet-network

networks:
  homesweet-network:
    driver: bridge